<title>탐코리아 견적·계약 생성기</title>
<style>
/* ══════════════ 토큰 ══════════════
   문서(.q/.k)는 고객 제출용 흑백 서식이라 색을 쓰지 않는다. 아래는 조작 UI 전용. */
:root{
  --tk-purple:#6b4ef0; --tk-purple-1:#7c5cf5; --tk-purple-2:#6440e8; --tk-purple-soft:#f1eeff;
  --tk-ink:#111; --tk-ink-strong:#1b1b23; --tk-ink-mid:#374151;
  --tk-muted:#6b7280; --tk-muted-2:#8a92a3; --tk-muted-3:#a5adba;
  --tk-line:#e3e6ec; --tk-line-2:#d7dbe3; --tk-line-3:#b9bfcc; --tk-hair:#eef0f4;
  --tk-bg:#eef0f4; --tk-surface:#fff; --tk-field:#fbfcfd; --tk-field-2:#fafbfc;
  --tk-warn-bg:#fff7ed; --tk-warn-line:#fed7aa; --tk-warn-ink:#9a3412;
  --tk-ok-bg:#ecfdf5; --tk-ok-line:#a7f3d0; --tk-ok-ink:#065f46;
  --tk-excel-green:#E2EFDA;   /* 견적서 머리행 — 원본 엑셀 테마색(accent6 80%) */
  --bar-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--tk-bg);color:var(--tk-ink);
     font-family:"맑은 고딕","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;
     padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 12px)}

/* ══════════════ 조작 UI ══════════════ */
.ui{max-width:820px;margin:0 auto;padding:14px 12px 4px}
.hd{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
.hd h1{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--tk-ink-strong)}
.hd h1 span{color:var(--tk-purple)}
.hd .v{font-size:11px;color:var(--tk-muted-3);margin-left:auto}

.steps{display:flex;gap:6px;margin:0 0 12px}
.steps div{flex:1;font-size:11.5px;font-weight:700;text-align:center;padding:7px 4px;border-radius:8px;
           background:var(--tk-surface);border:1px solid var(--tk-line);color:var(--tk-muted)}
.steps div b{display:block;font-size:10px;font-weight:600;color:var(--tk-muted-3);margin-bottom:1px}

.card{background:var(--tk-surface);border:1px solid var(--tk-line);border-radius:14px;
      padding:13px 14px 15px;margin-bottom:11px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -16px rgba(16,24,40,.18)}
.card > h2{font-size:12px;font-weight:700;color:var(--tk-muted);margin:0 0 10px;
           display:flex;align-items:center;gap:8px}
.card > h2::after{content:"";flex:1;height:1px;background:var(--tk-hair)}
.card > h2 em{font-style:normal;font-weight:600;color:var(--tk-muted-3);font-size:11px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 10px}
label{display:block;font-size:11px;font-weight:600;color:var(--tk-muted);margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;
      border:1px solid var(--tk-line-2);border-radius:9px;background:var(--tk-field);color:var(--tk-ink);
      transition:border-color .18s,box-shadow .18s,background .18s}
@media (min-width:600px){ input,select,textarea{font-size:13.5px;padding:8px 10px} }
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tk-purple-1);
      background:var(--tk-surface);box-shadow:0 0 0 3px rgba(107,78,240,.14)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:52px;line-height:1.45}

/* ─── 항목 목록 ─── */
.items{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--tk-line);border-radius:11px;padding:10px 11px;background:var(--tk-field-2);
    transition:background .16s,border-color .16s,opacity .16s}
.it.on{background:var(--tk-purple-soft);border-color:#cfc4fb}
.it.off{opacity:.5}
.it .top{display:flex;align-items:center;gap:9px}
.it .chk{width:21px;height:21px;flex:0 0 auto;margin:0;accent-color:var(--tk-purple-2)}
.it .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3;
        border:none;background:transparent;padding:2px 0;color:var(--tk-ink-strong)}
.it .amt{width:112px;flex:0 0 auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;
         padding:7px 8px;font-size:14px}
.it .edit{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:8px;font-size:13px;
          background:transparent;border:1px solid var(--tk-line-2);color:var(--tk-muted)}
.it .desc{margin:8px 0 0;display:none}
.it.open .desc{display:block}
.it .memo{margin:7px 0 0;font-size:11.5px;color:var(--tk-muted);line-height:1.5;white-space:pre-line;
          padding-left:30px}
.it.open .memo{display:none}
.it .del{margin-top:7px;font-size:11.5px;padding:6px 10px;background:transparent;
         border:1px solid var(--tk-line-2);color:var(--tk-warn-ink)}

.addrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.sum{margin-top:11px;padding:10px 12px;border-radius:10px;background:var(--tk-hair);
     display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tk-ink-mid)}
.sum b{font-variant-numeric:tabular-nums}
.sum .tot{margin-left:auto;font-size:14.5px;font-weight:800;color:var(--tk-ink-strong)}

button{font:inherit;font-size:13.5px;font-weight:700;padding:10px 15px;border-radius:10px;
       border:1px solid transparent;cursor:pointer;
       transition:transform .12s,box-shadow .18s,background .18s,border-color .18s}
button:active{transform:translateY(1px)}
.btn-p{background:linear-gradient(180deg,var(--tk-purple-1),var(--tk-purple-2));color:#fff;
       box-shadow:0 2px 10px -2px rgba(100,64,232,.5)}
.btn-s{background:var(--tk-surface);border-color:var(--tk-line-2);color:var(--tk-ink-mid)}
.btn-s:hover{border-color:var(--tk-line-3);background:var(--tk-field-2)}

.note{border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.55;margin-top:9px;display:none}
.note.on{display:block}
.note.warn{background:var(--tk-warn-bg);border:1px solid var(--tk-warn-line);color:var(--tk-warn-ink)}
.note.ok{background:var(--tk-ok-bg);border:1px solid var(--tk-ok-line);color:var(--tk-ok-ink)}

details.adv summary{font-size:11.5px;color:var(--tk-muted);cursor:pointer;font-weight:600;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸ ";color:var(--tk-muted-3)}
details.adv[open] summary::before{content:"▾ "}
details.adv .grid{margin-top:10px}

/* ─── 하단 고정 실행 바 ─── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.92);
     backdrop-filter:blur(10px);border-top:1px solid var(--tk-line);
     padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
     display:flex;gap:7px;justify-content:center}
.bar button{flex:1;max-width:250px;font-size:13px;padding:11px 6px;line-height:1.25}
.bar .sub{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:1px}

/* ─── 미리보기 (모바일에서는 축소) ─── */
.pvhead{max-width:820px;margin:16px auto 6px;padding:0 12px;display:flex;align-items:center;gap:8px}
.pvhead h3{font-size:12px;font-weight:700;color:var(--tk-muted-2);margin:0;letter-spacing:.03em}
.pvhead .tabs{margin-left:auto;display:flex;gap:5px}
.pvhead .tabs button{font-size:11.5px;padding:6px 11px;border-radius:8px;
      background:var(--tk-surface);border:1px solid var(--tk-line-2);color:var(--tk-muted)}
.pvhead .tabs button.sel{background:var(--tk-purple-2);border-color:var(--tk-purple-2);color:#fff}
.pvwrap{overflow:hidden;margin:0 auto 20px;max-width:820px;padding:0 12px}
.pvinner{transform-origin:top left}

/* ══════════════ 문서 공통 (실측 기반 — 손대지 말 것) ══════════════ */
.sheet{width:210mm;min-height:297mm;margin:0 auto 22px;background:#fff;color:#000;
       word-break:keep-all;overflow-wrap:break-word;
       box-shadow:0 2px 4px rgba(16,24,40,.06),0 18px 44px -22px rgba(16,24,40,.35)}
.sheet.quote .pad{padding:30mm 20.3mm 20mm 19.6mm}
.sheet.contract .pad{padding:25mm 18.8mm 25mm 25.4mm}

/* ─── 견적서 ─── */
.q{font-size:11pt;line-height:1.4}
.q table{border-collapse:collapse;width:100%;table-layout:fixed}
.q td{border:.75pt solid #000;padding:0 4pt;vertical-align:middle}
.q .title{height:48pt;text-align:center;font-family:"HY헤드라인M","H2HDRM","맑은 고딕",sans-serif;
          font-size:24pt;font-weight:800;letter-spacing:.28em;text-indent:.28em}
.q .lbl{background:var(--tk-excel-green);text-align:center;font-weight:700}
.q .row{height:25pt}
.q .c{text-align:center}.q .r{text-align:right}
.q .amount{text-align:center;font-weight:700;font-size:12pt}
.q .lead{height:36pt;text-align:center;border:none}
.q .unit{height:18pt;text-align:right;border:none;font-size:10pt;padding-right:2pt}
.q .item{height:35pt}
.q .item .nm{font-weight:700}
.q .item .ds{font-size:10pt;line-height:1.35}
.q .note-r{height:25pt;font-size:10pt;padding-left:14pt;white-space:nowrap}
.q .bank{height:37pt;text-align:center;font-weight:700}
.q .sw{position:relative}
.q .stamp{position:absolute;right:7pt;top:50%;transform:translateY(-50%);width:9mm;height:9mm}

/* ─── 계약서 ─── */
.k{font-size:11pt;line-height:1.70}
.k h1{text-align:center;font-size:18pt;font-weight:800;letter-spacing:.35em;text-indent:.35em;
      text-decoration:underline;text-underline-offset:6px;margin:0 0 22pt}
.k .intro{margin:0 0 20pt;padding-left:22pt;text-wrap:pretty}
.k .intro p{margin:0 0 6pt}
.k .cl{margin:0 0 14pt}
.k .cl .h{margin:0 0 4pt}
.k .cl .bd{padding-left:20pt;text-wrap:pretty}
@counter-style circ{system:fixed;symbols:"①" "②" "③" "④" "⑤" "⑥";suffix:""}
.k ol{margin:0;padding-left:24pt;list-style:none;counter-reset:ci}
.k ol li{counter-increment:ci;position:relative;margin:0 0 2pt}
.k ol li::before{content:counter(ci,circ);position:absolute;left:-22pt}
.k table{border-collapse:collapse;width:100%;table-layout:fixed;margin:8pt 0 4pt}
.k td,.k th{border:.75pt solid #000;padding:4pt 5pt;vertical-align:middle;font-weight:400;font-size:10pt}
.k th{font-size:11pt;text-align:center}
.k th.small,.k td.cost{font-size:10pt}
.k .svc{line-height:1.55;font-size:9pt}
.k .svc div{text-indent:-8pt;padding-left:8pt}
.k .pay{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.k .brk{page-break-before:always;break-before:page}
.k .sign{margin-top:26pt;padding-left:22pt;line-height:1.85}
.k .sign .p{margin-bottom:16pt;position:relative}
.k .sign .lb{display:inline-block;width:22pt;white-space:nowrap}
.k .sign .r2{padding-left:22pt}
.k .stamp{position:absolute;left:108pt;bottom:-34pt;width:12.4mm;height:12.4mm}
.k .date{text-align:right;margin-top:56pt;padding-right:44pt;letter-spacing:.06em}

@media screen{ .k .brk{margin:26px -20mm;border-top:1px dashed #c9cfda;padding-top:26px} }

/* ══════════════ 인쇄 ══════════════ */
@media print{
  html,body{background:#fff;padding:0}
  .ui,.bar,.pvhead{display:none !important}
  /* 맞춤() 이 .pvwrap 에 인라인 height 를 박는다. 인쇄에서 풀지 않으면
     그 높이만큼 빈 둘째 쪽이 생긴다(실측 2026-08-10). */
  .pvwrap{overflow:visible;max-width:none;padding:0;margin:0;height:auto !important}
  .pvinner{transform:none !important}
  .sheet{width:auto;min-height:0;margin:0;box-shadow:none}
  .sheet .pad{padding:0 !important}
  .sheet{display:none}
  body.p-q  #sheet-q{display:block}
  body.p-q0 #sheet-q{display:block}
  body.p-k  #sheet-k{display:block}
  .k .brk{margin:0;border:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="ui">
  <div class="hd">
    <h1>탐코리아 <span>견적 · 계약</span> 생성기</h1>
    <span class="v" id="ver"></span>
  </div>

  <div class="steps">
    <div><b>1</b>가견적 (합계 없음)</div>
    <div><b>2</b>확정견적</div>
    <div><b>3</b>계약서</div>
  </div>

  <div class="card">
    <h2>고객 정보</h2>
    <div class="grid">
      <div><label>업체명</label><input id="f_업체명" placeholder="9.81파크"></div>
      <div><label>수신인</label><input id="f_수신인" placeholder="양현모 담당자님"></div>
      <div><label>견적일자</label><input id="f_견적일자"></div>
    </div>
    <div class="note warn" id="w_고객"></div>
  </div>

  <div class="card">
    <h2>공급 항목 <em>체크한 것만 나간다 · 금액은 눌러서 고친다</em></h2>
    <div class="items" id="items"></div>
    <div class="addrow">
      <button class="btn-s" onclick="전체선택(true)">전체 선택</button>
      <button class="btn-s" onclick="전체선택(false)">전체 해제</button>
      <button class="btn-s" onclick="항목추가()">+ 항목 추가</button>
      <button class="btn-s" onclick="카탈로그복원()">기본 상품표로 되돌리기</button>
    </div>
    <div class="sum" id="sum"></div>
  </div>

  <div class="card">
    <h2>계약서에만 필요한 값 <em>3단계에서 쓴다</em></h2>
    <div class="grid">
      <div><label>대표자명</label><input id="f_대표자" placeholder="김홍열"></div>
      <div><label>사업자번호</label><input id="f_사업자번호" placeholder="000-00-00000"></div>
      <div><label>계약기간</label><input id="f_계약기간" placeholder="1개월간"></div>
      <div><label>계약일자</label><input id="f_계약일자"></div>
    </div>
    <div class="note warn" id="w_계약"></div>
  </div>

  <div class="card">
    <details class="adv">
      <summary>기타사항 문구 · 공급자 정보 (바꿀 일 거의 없음)</summary>
      <div style="margin-top:10px">
        <label>기타사항 — 한 줄에 하나. 앞의 * 는 자동으로 붙는다</label>
        <textarea id="f_기타사항" rows="6"></textarea>
      </div>
      <div class="grid" style="margin-top:10px">
        <div><label>상호</label><input id="s_상호"></div>
        <div><label>사업자번호</label><input id="s_사업자번호"></div>
        <div><label>대표 (견적서)</label><input id="s_대표"></div>
        <div><label>대표 (계약서)</label><input id="s_대표영문"></div>
        <div><label>종목</label><input id="s_종목"></div>
        <div><label>전화</label><input id="s_전화"></div>
        <div style="grid-column:1/-1"><label>입금계좌 (견적서)</label><input id="s_계좌견적"></div>
        <div style="grid-column:1/-1"><label>입금계좌 (계약서)</label><input id="s_계좌계약"></div>
      </div>
      <div class="addrow"><button class="btn-s" onclick="입력초기화()">전체 입력 초기화</button></div>
    </details>
  </div>
</div>

<div class="pvhead">
  <h3>미리보기</h3>
  <div class="tabs">
    <button id="tab-q0" class="sel" onclick="미리보기('q0')">가견적</button>
    <button id="tab-q"  onclick="미리보기('q')">확정견적</button>
    <button id="tab-k"  onclick="미리보기('k')">계약서</button>
  </div>
</div>
<div class="pvwrap"><div class="pvinner" id="pvinner">
  <div class="sheet quote"    id="sheet-q"><div class="pad"><div class="q" id="body-q"></div></div></div>
  <div class="sheet contract" id="sheet-k"><div class="pad"><div class="k" id="body-k"></div></div></div>
</div></div>

<div class="bar">
  <button class="btn-p" onclick="printDoc('q0')">가견적 PDF<span class="sub">합계 없음 · 전 항목</span></button>
  <button class="btn-p" onclick="printDoc('q')">확정견적 PDF<span class="sub">고른 항목 · 합계 포함</span></button>
  <button class="btn-p" onclick="printDoc('k')">계약서 PDF<span class="sub">확정견적 기준</span></button>
</div>

        <button class="del" data-i="${i}" data-k="삭제">이 항목 삭제</button>
      </div>
    </div>`).join("");

  box.querySelectorAll("[data-i]").forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    if (k === "삭제")      el.onclick = () => { 항목.splice(i, 1); 항목그리기(); render(); };
    else if (k === "열림") el.onclick = () => { 항목[i].열림 = !항목[i].열림; 항목그리기(); };
    else if (k === "선택") el.onchange = () => {
      // 목록 전체를 다시 그리면 폰에서 깜빡이고 스크롤이 튄다 → 그 줄만 바꾼다
      항목[i].선택 = el.checked;
      el.closest(".it").classList.toggle("on", el.checked);
      el.closest(".it").classList.toggle("off", !el.checked);
      render();
    };
    else if (k === "내용") el.oninput = () => { 항목[i].내용 = el.value.split("\n"); render(); };

      el.onblur   = () => { el.value = won(항목[i].공급가액); };

    } else el.oninput = () => { 항목[i][k] = el.value; render(); };
  });

    + `<span class="tot">합계 ₩${won(공급계 + Math.round(공급계*0.1))}</span>`;

  const [pt, pb] = 견적여백(견적항목수(보기));

  $("pagerule").textContent = pageRule(보기);

  경고(d, its);
  맞춤();
  save();
}

function 경고(d, its){
  const a = [];
  if (!d.업체명.trim()) a.push("업체명");
  if (!d.수신인.trim()) a.push("수신인");
  if (!d.견적일자.trim()) a.push("견적일자");
  setNote("w_고객", a.length ? "비어 있음: " + a.join(", ") : "", "warn");

  const b = [];
  if (!d.대표자.trim()) b.push("대표자명");
  if (!d.사업자번호.trim()) b.push("사업자번호");
  if (!its.length) b.push("선택된 항목이 없다");
  if (its.some(x => /1년/.test(x.항목) || x.내용.some(y => /1년/.test(y))) && !/년/.test(d.계약기간))
    b.push("1년 입점 상품이 들어 있다 — 계약기간이 " + (d.계약기간 || "빈칸") + " 로 맞는지 확인");
  setNote("w_계약", b.length ? "계약서 내기 전 확인: " + b.join(" · ") : "", "warn");
}
function setNote(id, msg, cls){
  const el = $(id);
  el.className = "note " + cls + (msg ? " on" : "");
  el.textContent = msg;
}

/* 모바일에서 A4(210mm)가 화면보다 넓다 → 폭에 맞춰 축소 */
function 맞춤(){
  const wrap = document.querySelector(".pvwrap");
  const inner = $("pvinner");
  if (!wrap || !inner) return;
  const 가용 = wrap.clientWidth - 24;
  const A4 = 793.7;                       // 210mm @96dpi
  const r = Math.min(1, 가용 / A4);
  inner.style.transform = r < 1 ? `scale(${r})` : "none";
  const h = 보기 === "k" ? $("sheet-k").offsetHeight : $("sheet-q").offsetHeight;
  wrap.style.height = (h * r + 24) + "px";
}
window.addEventListener("resize", 맞춤);

function 미리보기(which){
  보기 = which;
  ["q0","q","k"].forEach(t => $("tab-" + t).classList.toggle("sel", t === which));
  $("sheet-q").style.display = which === "k" ? "none" : "block";
  $("sheet-k").style.display = which === "k" ? "block" : "none";
  render();
}

    const o = { 항목, 기타사항: $("f_기타사항").value };
    필드키.forEach(k => o[k] = $("f_" + k).value);
    Object.keys(CATALOG.공급자).forEach(k => o["s_" + k] = $("s_" + k).value);
    localStorage.setItem(KEY, JSON.stringify(o));
  }catch(e){}
}
function load(){
  let o = null;
  try{ o = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  const t = 오늘();
  필드키.forEach(k => $("f_" + k).value =
      (o && o[k] != null) ? o[k]
    : k === "견적일자" ? t.q : k === "계약일자" ? t.k : k === "계약기간" ? "1개월간" : "");
  Object.keys(CATALOG.공급자).forEach(k =>
    $("s_" + k).value = (o && o["s_" + k] != null) ? o["s_" + k] : CATALOG.공급자[k]);
  $("f_기타사항").value = (o && o.기타사항 != null) ? o.기타사항 : CATALOG.기타사항.join("\n");
  항목 = (o && Array.isArray(o.항목) && o.항목.length) ? o.항목 : 기본항목();
  항목.forEach(it => { it.내용 = Array.isArray(it.내용) ? it.내용 : [String(it.내용 || "")]; it.열림 = false; });
}
function 입력초기화(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  load(); 항목그리기(); render();
}

/* ── 인쇄 ── */
const 종류 = { q0:"가견적서", q:"견적서", k:"계약서" };
function 견적여백(n){
  // 원본 실측: 항목이 많으면 엑셀도 위 여백을 줄여 한 쪽에 담았다.
  if (n <= 4) return ["30mm", "20mm"];     // 돈독치기 확정견적·라프
  if (n <= 6) return ["18.8mm", "14mm"];   // 9.81파크·도토리 가견적
  return ["13mm", "9mm"];                  // 그 이상 — 최대한 눌러 담는다
}
function 견적항목수(which){
  return (which === "q0" ? 항목 : 고른항목()).length;
}
function pageRule(which){
  if (which === "k") return "@page{size:A4 portrait;margin:25mm 18.8mm 25mm 25.4mm}";
  const [t, b] = 견적여백(견적항목수(which));
  return `@page{size:A4 portrait;margin:${t} 20.3mm ${b} 19.6mm}`;
}
function printDoc(which){
  미리보기(which);                       // 인쇄 대상과 미리보기를 항상 일치시킨다
  document.body.classList.remove("p-q","p-q0","p-k");
  document.body.classList.add("p-" + which);
  $("pagerule").textContent = pageRule(which);
  const 업체 = ($("f_업체명").value || "업체").trim().replace(/[\\/:*?"<>|]/g, "");
  const 원제목 = document.title;
  document.title = `${업체}_${종류[which]}_탐코리아`;   // 인쇄 대화상자 기본 파일명
  setTimeout(() => { window.print(); document.title = 원제목; }, 80);
}
window.addEventListener("afterprint", () => document.body.classList.remove("p-q","p-q0","p-k"));

/* ── 초기화 ── */
(function init(){
  $("ver").textContent = VER;
  load();

  // 일괄생성(헤드리스)용: ?doc=q0|q|k&d=<base64url JSON>
  const qs = new URLSearchParams(location.search);
  if (qs.get("d")){
    try{
      const json = new TextDecoder().decode(Uint8Array.from(
        atob(qs.get("d").replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0)));
      const o = JSON.parse(json);
      필드키.forEach(k => { if (o[k] != null) $("f_" + k).value = o[k]; });
      Object.keys(CATALOG.공급자).forEach(k => { if (o["s_" + k] != null) $("s_" + k).value = o["s_" + k]; });
      if (Array.isArray(o.기타사항)) $("f_기타사항").value = o.기타사항.join("\n");
      if (Array.isArray(o.항목) && o.항목.length){
        항목 = o.항목.map(x => ({
          선택: x.선택 !== false, 항목: x.항목 || "",
          내용: Array.isArray(x.내용) ? x.내용 : String(x.내용 || "").split("\n"),
          공급가액: 숫자(x.공급가액), 열림: false }));
      }
    }catch(e){ document.title = "PARSE_ERROR"; }
  }

  항목그리기();

  const doc = qs.get("doc");
  if (doc === "q" || doc === "k" || doc === "q0"){
    보기 = doc;
    document.body.classList.add("p-" + doc);
    $("pagerule").textContent = pageRule(doc);
    document.querySelector(".ui").style.display = "none";
    document.querySelector(".bar").style.display = "none";
    document.querySelector(".pvhead").style.display = "none";
  }

  document.querySelectorAll(".ui input, .ui textarea").forEach(el => {
    if (el.closest(".items")) return;      // 항목 입력은 항목그리기() 가 따로 붙인다
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  미리보기(보기);
})();
</script>
