<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>입장 체크인 · TAMKOREA</title>
<!--
  초경량 독립 체크인 페이지 — React 번들(1.1MB)을 쓰지 않는다.
  위챗 扫一扫가 여는 첫 화면이라 모바일 회선에서 즉시 떠야 한다.
  v1.6 "무조건 QR": 스캔만으로 전부 끝난다 —
    · 제출 토큰이 폰에 있으면 즉시 자동 체크인
    · 없으면 오늘 이 매장 예약 명단에서 본인 계정을 탭 (제출 링크·코드 불필요)
  성공 화면은 매장 직원에게 보여주는 "예약 확인증"이다 (한국어 크게).
  라우팅: vercel.json 이 /checkin → /checkin.html 로 리라이트한다.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    background: #f4f4f8; color: #1a1a2e; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px;
  }
  .card {
    background: #fff; border-radius: 16px; width: 100%; max-width: 420px;
    padding: 32px 22px; text-align: center;
    box-shadow: 0 8px 28px rgba(60, 40, 140, .12);
  }
  .ok-card { border-top: 6px solid #16a34a; }
  .warn-card { border-top: 6px solid #d97706; }
  .err-card { border-top: 6px solid #dc2626; }
  .icon { font-size: 52px; margin-bottom: 12px; }
  .title-ko { font-size: 1.45rem; font-weight: 800; line-height: 1.35; }
  .title-ok { color: #16a34a; }
  .xid {
    font-size: 1.5rem; font-weight: 800; margin: 14px 0 4px; word-break: break-all;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .meta { color: #444; font-size: 1.02rem; margin-top: 6px; line-height: 1.6; }
  .meta b { font-size: 1.1rem; }
  .sub { color: #888; font-size: .86rem; margin-top: 14px; line-height: 1.55; }
  .clock { margin-top: 14px; font-size: .9rem; color: #666; }
  .clock b { font-variant-numeric: tabular-nums; color: #333; }
  .other {
    margin-top: 14px; background: #fffbeb; border: 1px solid #fde68a;
    border-radius: 10px; padding: 12px; font-size: .95rem; line-height: 1.6; text-align: left;
  }
  .cand {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin-top: 8px; padding: 14px; border-radius: 12px; font-size: 1.05rem;
    border: 1px solid #c7d2fe; background: #eef2ff; cursor: pointer; text-align: left;
  }
  .cand:disabled { border-color: #bbf7d0; background: #f0fdf4; cursor: default; }
  .cand .nm { font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cand .tm { flex-shrink: 0; margin-left: 10px; color: #4f46e5; font-weight: 700; font-size: .9rem; }
  .cand:disabled .tm { color: #16a34a; }
  button.act {
    margin-top: 14px; border: none; border-radius: 22px; padding: 12px 26px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .brand { margin-top: 26px; letter-spacing: .35em; color: #b9b9c9; font-size: .78rem; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 4px solid #e5e0f8; border-top-color: #7c3aed; animation: sp 1s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="spin"></div>
  <div class="title-ko">체크인 처리 중…</div>
  <div class="meta">正在签到…</div>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search);
  var s = q.get('s') || '';
  var t = q.get('t') || '';
  var clockTimer = null;

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function readTok() { try { return localStorage.getItem('tk_submit_token') || ''; } catch (e) { return ''; } }
  function brand() { return '<div class="brand">T A M K O R E A</div>'; }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }
  function startClock() {
    var el = document.getElementById('now');
    if (!el) return;
    function tick() {
      var d = new Date();
      var p = function (n) { return String(n).padStart(2, '0'); };
      el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    tick();
    clockTimer = setInterval(tick, 1000);
  }
  function loadingView(msg) {
    stopClock();
    app.className = 'card';
    app.innerHTML = '<div class="spin"></div><div class="title-ko">' + esc(msg || '체크인 처리 중…') + '</div><div class="meta">正在签到…</div>';
  }
  function post(body) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timeo = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    return fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      if (timeo) clearTimeout(timeo);
      return r.json().catch(function () { return {}; }).then(function (d) { return { st: r.status, d: d }; });
    });
  }

  // 성공/재확인 화면 = 매장 직원에게 보여주는 예약 확인증. 라이브 시계로 캡처 재사용을 구분.
  function showOk(d, alreadyFlag) {
    stopClock();
    app.className = 'card ok-card';
    app.innerHTML =
      '<div class="icon">✅</div>' +
      '<div class="title-ko title-ok">예약된 체험단입니다</div>' +
      '<div class="xid">' + esc(d.xid || '') + '</div>' +
      '<div class="meta"><b>' + esc(d.store || '') + '</b><br />' +
      (d.resvWhen ? '예약 ' + esc(d.resvWhen) : '') +
      (d.pax !== '' && d.pax != null ? ' · ' + esc(d.pax) + '인' : '') + '</div>' +
      '<div class="meta">' + (alreadyFlag ? '체크인 완료 ' : '입장 확인 ') + esc(d.when || '') + '</div>' +
      '<div class="clock">현재 시각 <b id="now"></b></div>' +
      '<div class="sub">이 화면을 매장 직원에게 보여주세요.<br />签到成功，请向店员出示此页面。</div>' +
      brand();
    startClock();
  }

  function showNoMatch(d) {
    stopClock();
    app.className = 'card warn-card';
    var others = '';
    if (d.otherToday && d.otherToday.length) {
      others = '<div class="other"><b>오늘 예약 지점 / 您今天的预约:</b><br />' +
        d.otherToday.map(function (o) {
          return '📍 ' + esc(o.store) + ' <span style="color:#92400e">' + esc(o.when) + '</span>';
        }).join('<br />') +
        '<br /><span style="font-size:.85rem;color:#92400e">지점이 다릅니다 — 위 지점으로 방문해 주세요 / 请前往以上门店</span></div>';
    }
    app.innerHTML =
      '<div class="icon">🔍</div>' +
      '<div class="title-ko">이 지점의 오늘 예약이 없습니다</div>' +
      '<div class="meta">未找到今天在此店的预约</div>' +
      others +
      '<div class="sub">' + (others ? '' : '예약 정보를 담당자에게 확인해 주세요.<br />请联系您的负责人确认预约。') + '</div>' +
      brand();
  }

  function showErr(msg) {
    stopClock();
    app.className = 'card err-card';
    app.innerHTML =
      '<div class="icon">❌</div>' +
      '<div class="title-ko">체크인 실패</div>' +
      '<div class="meta">签到失败</div>' +
      '<div class="sub">' + esc(msg || '') + '</div>' +
      '<button class="act" onclick="location.reload()">다시 시도 / 重试</button>' +
      brand();
  }

  function showBadQr() {
    stopClock();
    app.className = 'card err-card';
    app.innerHTML =
      '<div class="icon">⚠️</div>' +
      '<div class="title-ko">유효하지 않은 QR입니다</div>' +
      '<div class="meta">二维码无效，请重新扫描店内二维码</div>' +
      brand();
  }

  // 토큰 없는 폰: 오늘 이 매장 예약 명단에서 본인 계정을 고른다 (QR 스캔만으로 완결)
  function showPicker() {
    loadingView('예약 확인 중…');
    post({ storeId: s, sig: t, who: 1 }).then(function (x) {
      if (x.st !== 200 || !x.d.ok) { showErr(x.d.error || ('오류 ' + x.st)); return; }
      var cands = x.d.cands || [];
      if (!cands.length) { showNoMatch({}); return; }
      stopClock();
      app.className = 'card';
      app.innerHTML =
        '<div class="icon">🙋</div>' +
        '<div class="title-ko" style="font-size:1.2rem">본인 계정을 선택해 주세요</div>' +
        '<div class="meta" style="font-size:.95rem">请选择您的账号 · <b>' + esc(x.d.store || '') + '</b></div>' +
        '<div id="cands"></div>' +
        '<div class="sub">오늘 이 매장에 예약된 체험단 명단입니다.<br />以下是今天在本店的预约名单。</div>' +
        brand();
      var wrap = document.getElementById('cands');
      cands.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'cand';
        b.disabled = !!c.checked;
        b.innerHTML = '<span class="nm">' + esc(c.xid) + '</span>' +
          '<span class="tm">' + (c.checked ? '✅ 已签到' : esc(c.when) + ' →') + '</span>';
        if (!c.checked) {
          b.onclick = function () {
            loadingView();
            post({ storeId: s, sig: t, pick: c.pid }).then(function (y) {
              if (y.st === 200 && y.d.ok) return showOk(y.d, !!y.d.already);
              showErr(y.d.error || ('오류 ' + y.st));
            }).catch(function () { showErr('네트워크 연결이 불안정합니다 / 网络不稳定，请重试'); });
          };
        }
        wrap.appendChild(b);
      });
    }).catch(function () { showErr('네트워크 연결이 불안정합니다 / 网络不稳定，请重试'); });
  }

  function run(tok) {
    loadingView();
    post({ inflToken: tok, storeId: s, sig: t }).then(function (x) {
      if (x.st === 200 && x.d.ok) return showOk(x.d, !!x.d.already);
      if (x.d.noMatch) return showNoMatch(x.d);
      if (x.d.badToken) return showPicker(); // 낡은 토큰 — 명단 선택으로 폴백
      showErr(x.d.error || ('오류 ' + x.st));
    }).catch(function () {
      showErr('네트워크 연결이 불안정합니다 / 网络不稳定，请重试');
    });
  }

  if (!s || !t) { showBadQr(); return; }
  var tok = readTok();
  if (tok) { run(tok); } else { showPicker(); }
})();
</script>
</body>
</html>
