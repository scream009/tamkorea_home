<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>입장 체크인 · TAMKOREA</title>
<!--
  초경량 독립 체크인 페이지 — React 번들(1.1MB)을 쓰지 않는다.
  위챗 扫一扫가 여는 첫 화면이라 모바일 회선에서 즉시 떠야 하고("지연되다 연결 안 됨" 대책),
  성공 화면은 매장 직원에게 보여주는 "예약 확인증"으로 설계됐다 (한국어 크게).
  라우팅: vercel.json 이 /checkin → /checkin.html 로 리라이트한다.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    background: #f4f4f8; color: #1a1a2e; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px;
  }
  .card {
    background: #fff; border-radius: 16px; width: 100%; max-width: 420px;
    padding: 32px 22px; text-align: center;
    box-shadow: 0 8px 28px rgba(60, 40, 140, .12);
  }
  .ok-card { border-top: 6px solid #16a34a; }
  .warn-card { border-top: 6px solid #d97706; }
  .err-card { border-top: 6px solid #dc2626; }
  .icon { font-size: 52px; margin-bottom: 12px; }
  .title-ko { font-size: 1.45rem; font-weight: 800; line-height: 1.35; }
  .title-ok { color: #16a34a; }
  .xid {
    font-size: 1.5rem; font-weight: 800; margin: 14px 0 4px; word-break: break-all;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .meta { color: #444; font-size: 1.02rem; margin-top: 6px; line-height: 1.6; }
  .meta b { font-size: 1.1rem; }
  .sub { color: #888; font-size: .86rem; margin-top: 14px; line-height: 1.55; }
  .clock { margin-top: 14px; font-size: .9rem; color: #666; }
  .clock b { font-variant-numeric: tabular-nums; color: #333; }
  .other {
    margin-top: 14px; background: #fffbeb; border: 1px solid #fde68a;
    border-radius: 10px; padding: 12px; font-size: .95rem; line-height: 1.6; text-align: left;
  }
  input {
    width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 9px;
    font-size: .95rem; margin-top: 10px;
  }
  button {
    margin-top: 14px; border: none; border-radius: 22px; padding: 12px 26px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .errmsg { color: #dc2626; font-size: .86rem; margin-top: 10px; }
  .brand { margin-top: 26px; letter-spacing: .35em; color: #b9b9c9; font-size: .78rem; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 4px solid #e5e0f8; border-top-color: #7c3aed; animation: sp 1s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="spin"></div>
  <div class="title-ko">체크인 처리 중…</div>
  <div class="meta">正在签到…</div>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search);
  var s = q.get('s') || '';
  var t = q.get('t') || '';
  var clockTimer = null;

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function readTok() { try { return localStorage.getItem('tk_submit_token') || ''; } catch (e) { return ''; } }
  function saveTok(v) { try { localStorage.setItem('tk_submit_token', v); } catch (e) {} }
  function brand() { return '<div class="brand">T A M K O R E A</div>'; }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }
  function startClock() {
    var el = document.getElementById('now');
    if (!el) return;
    function tick() {
      var d = new Date();
      var p = function (n) { return String(n).padStart(2, '0'); };
      el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    tick();
    clockTimer = setInterval(tick, 1000);
  }

  // 성공/재확인 화면 = 매장 직원에게 보여주는 예약 확인증. 라이브 시계로 캡처 재사용을 구분.
  function showOk(d, alreadyFlag) {
    stopClock();
    app.className = 'card ok-card';
    app.innerHTML =
      '<div class="icon">✅</div>' +
      '<div class="title-ko title-ok">예약된 체험단입니다</div>' +
      '<div class="xid">' + esc(d.xid || '') + '</div>' +
      '<div class="meta"><b>' + esc(d.store || '') + '</b><br />' +
      (d.resvWhen ? '예약 ' + esc(d.resvWhen) : '') +
      (d.pax !== '' && d.pax != null ? ' · ' + esc(d.pax) + '인' : '') + '</div>' +
      '<div class="meta">' + (alreadyFlag ? '체크인 완료 ' : '입장 확인 ') + esc(d.when || '') + '</div>' +
      '<div class="clock">현재 시각 <b id="now"></b></div>' +
      '<div class="sub">이 화면을 매장 직원에게 보여주세요.<br />签到成功，请向店员出示此页面。</div>' +
      brand();
    startClock();
  }

  function showNoMatch(d) {
    stopClock();
    app.className = 'card warn-card';
    var others = '';
    if (d.otherToday && d.otherToday.length) {
      others = '<div class="other"><b>오늘 예약 지점 / 您今天的预约:</b><br />' +
        d.otherToday.map(function (o) {
          return '📍 ' + esc(o.store) + ' <span style="color:#92400e">' + esc(o.when) + '</span>';
        }).join('<br />') +
        '<br /><span style="font-size:.85rem;color:#92400e">지점이 다릅니다 — 위 지점으로 방문해 주세요 / 请前往以上门店</span></div>';
    }
    app.innerHTML =
      '<div class="icon">🔍</div>' +
      '<div class="title-ko">이 지점의 오늘 예약이 없습니다</div>' +
      '<div class="meta">未找到今天在此店的预约</div>' +
      others +
      '<div class="sub">' + (others ? '' : '예약 정보를 담당자에게 확인해 주세요.<br />请联系您的负责人确认预约。') + '</div>' +
      brand();
  }

  function showErr(msg) {
    stopClock();
    app.className = 'card err-card';
    app.innerHTML =
      '<div class="icon">❌</div>' +
      '<div class="title-ko">체크인 실패</div>' +
      '<div class="meta">签到失败</div>' +
      '<div class="sub">' + esc(msg || '') + '</div>' +
      '<button onclick="location.reload()">다시 시도 / 重试</button>' +
      brand();
  }

  function showNoToken() {
    stopClock();
    app.className = 'card warn-card';
    app.innerHTML =
      '<div class="icon">🔗</div>' +
      '<div class="title-ko" style="font-size:1.15rem">제출 링크를 먼저 열어주세요</div>' +
      '<div class="meta" style="font-size:.95rem">请先打开您的"提交链接"</div>' +
      '<div class="sub">담당자가 보낸 제출 링크를 위챗에서 한 번 연 뒤, 이 QR을 다시 스캔해 주세요.<br />' +
      '在微信中打开负责人发的提交链接（打开一次即可），然后重新扫码。</div>' +
      '<div class="sub" style="margin-top:16px;border-top:1px solid #eee;padding-top:12px">또는 제출 링크를 붙여넣기 / 或粘贴提交链接</div>' +
      '<input id="paste" placeholder="https://www.tamkorea.com/submit?token=..." />' +
      '<button id="go">체크인 / 签到</button>' +
      '<div class="errmsg" id="perr"></div>' +
      brand();
    document.getElementById('go').onclick = function () {
      var v = (document.getElementById('paste').value || '').trim();
      var m = v.match(/submit_[A-Za-z0-9]+/);
      if (!m) {
        document.getElementById('perr').textContent = '링크를 인식하지 못했습니다 / 无法识别链接';
        return;
      }
      saveTok(m[0]);
      run(m[0]);
    };
  }

  function showBadQr() {
    stopClock();
    app.className = 'card err-card';
    app.innerHTML =
      '<div class="icon">⚠️</div>' +
      '<div class="title-ko">유효하지 않은 QR입니다</div>' +
      '<div class="meta">二维码无效，请重新扫描店内二维码</div>' +
      brand();
  }

  function run(tok) {
    app.className = 'card';
    app.innerHTML = '<div class="spin"></div><div class="title-ko">체크인 처리 중…</div><div class="meta">正在签到…</div>';
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timeo = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inflToken: tok, storeId: s, sig: t }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { st: r.status, d: d }; });
    }).then(function (x) {
      if (timeo) clearTimeout(timeo);
      if (x.st === 200 && x.d.ok) return showOk(x.d, !!x.d.already);
      if (x.d.noMatch) return showNoMatch(x.d);
      showErr(x.d.error || ('오류 ' + x.st));
    }).catch(function () {
      if (timeo) clearTimeout(timeo);
      showErr('네트워크 연결이 불안정합니다 / 网络不稳定，请重试');
    });
  }

  if (!s || !t) { showBadQr(); return; }
  var tok = readTok();
  if (!tok) { showNoToken(); return; }
  run(tok);
})();
</script>
</body>
</html>
